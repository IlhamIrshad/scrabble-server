<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Games — Scrabble boards</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="dashboard">

<header class="topbar">
  <h1>Games</h1>
  <span class="spacer"></span>
  <span id="who" class="muted"></span>
  <button id="new-game" class="primary">new game</button>
  <button id="import">import a file</button>
  <button id="sign-out">sign out</button>
</header>

<main class="games">
  <p id="loading" class="muted">Loading…</p>

  <p id="empty" class="empty" hidden>
    No games yet. Press <b>new game</b> to start one, then scan a photograph of your
    board into it.
  </p>

  <p id="trouble" class="fail" hidden></p>

  <ul id="list" class="game-list"></ul>
</main>

<input type="file" id="import-file" accept="application/json,.json" hidden>

<script type="module" src="src/dashboard.js"></script>
</body>
</html>
