<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Virtual board</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="restore" class="banner" hidden>
  A board from a previous session was found.
  <button id="restore-yes">Restore it</button>
  <button id="restore-no">Start fresh</button>
</div>

<main>
  <section class="board-pane">
    <div id="board" class="board"></div>

    <div class="toolbar">
      <button id="turn-scan" title="The photograph was taken a quarter turn round: turn this turn's tiles to match">&#8635; turn scan</button>
      <button id="flip" title="Switch between typing across and down (Tab)">&#8646; <span id="direction">across</span></button>
      <button id="blank-mode" aria-pressed="false" title="Place blanks (or hold Shift)">blank</button>
      <button id="clear-cell" title="Clear the selected square (Delete)">&#9003; clear</button>
      <span id="cursor-label" class="muted"></span>
      <span id="lock-note" class="warn" hidden>
        viewing history &mdash; <button id="unlock">edit this turn</button>
      </span>
    </div>
  </section>

  <aside class="panels">
    <section class="panel">
      <h2>Scan <span id="api-state" class="muted">checking…</span></h2>
      <div class="scan-row">
        <button id="scan-new" class="primary">new turn + scan</button>
        <button id="scan-here">rescan this turn</button>
      </div>
      <p id="scan-result" class="muted">Pick a photograph of the board; the reader fills the turn in.</p>
      <label class="field">
        reader address
        <input id="api-base" type="text" spellcheck="false">
      </label>
    </section>

    <section class="panel">
      <h2>Turn <span id="turn-n">1</span> of <span id="turn-total">1</span></h2>
      <p id="turn-who" class="muted"></p>
      <p id="turn-delta" class="muted"></p>
      <label class="field">
        annotation
        <select id="annotation">
          <option value="play">play</option>
          <option value="pass">pass</option>
          <option value="exchange">exchange</option>
          <option value="challenge">challenge</option>
          <option value="unknown">unknown</option>
        </select>
      </label>
      <label class="field">
        note
        <input id="note" type="text" placeholder="operator note">
      </label>
    </section>

    <section class="panel">
      <h2>Tile pool <span id="pool-left" class="muted"></span></h2>
      <div id="pool" class="pool"></div>
      <p id="pool-errors" class="fail" hidden></p>
    </section>

    <section class="panel">
      <h2>Checks</h2>
      <ul id="checks" class="checks"></ul>
    </section>
  </aside>
</main>

<footer>
  <button id="first" title="First turn (Home)">&laquo;</button>
  <button id="prev" title="Previous turn">&lsaquo;</button>
  <div id="turn-strip" class="strip"></div>
  <button id="next" title="Next turn">&rsaquo;</button>
  <button id="last" title="Last turn (End)">&raquo;</button>
  <span class="spacer"></span>
  <button id="add-turn" class="primary">+ new turn</button>
  <button id="del-turn">delete last</button>
  <span class="spacer"></span>
  <button id="undo" title="Ctrl/Cmd+Z">undo</button>
  <button id="redo" title="Ctrl/Cmd+Shift+Z">redo</button>
  <button id="new-game">new game</button>
  <button id="load-sample">load sample</button>
  <button id="import">import</button>
  <button id="export">export</button>
</footer>

<dialog id="import-dialog">
  <form method="dialog">
    <h2>Import a board</h2>
    <p class="muted">Choose a file, drop one here, or paste the JSON.</p>
    <input type="file" id="import-file" accept="application/json,.json">
    <div id="drop" class="drop">drop a .json file here</div>
    <textarea id="import-text" rows="8" placeholder="paste JSON"></textarea>
    <p id="import-problems" class="fail" hidden></p>
    <menu>
      <button value="cancel">cancel</button>
      <button id="import-go" value="default" type="button" class="primary">import</button>
    </menu>
  </form>
</dialog>

<script type="module" src="src/app.js"></script>
</body>
</html>
